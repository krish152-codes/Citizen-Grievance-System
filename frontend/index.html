<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ══════════════════════════════════════════
         APP TITLE & SEO
    ══════════════════════════════════════════ -->
    <title>SheharSetu — Citizen Grievance Platform</title>
    <meta name="description" content="Report and track civic issues in your city. AI-powered grievance management platform for smarter cities." />
    <meta name="keywords" content="SheharSetu, citizen grievance, civic issues, city complaints, urban management, India" />
    <meta name="author" content="SheharSetu" />
    <meta name="robots" content="index, follow" />

    <!-- ══════════════════════════════════════════
         THEME COLOR (browser bar / android)
    ══════════════════════════════════════════ -->
    <meta name="theme-color" content="#0f3460" />
    <meta name="msapplication-TileColor" content="#0f3460" />
    <meta name="msapplication-TileImage" content="/icons/icon_144.png" />

    <!-- ══════════════════════════════════════════
         FAVICONS (browser tab)
    ══════════════════════════════════════════ -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon_16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon_32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon_48.png" />

    <!-- ══════════════════════════════════════════
         APPLE (iPhone / iPad home screen)
    ══════════════════════════════════════════ -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple_touch_icon_180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SheharSetu" />

    <!-- ══════════════════════════════════════════
         ANDROID / PWA (install on home screen)
    ══════════════════════════════════════════ -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ══════════════════════════════════════════
         OPEN GRAPH (WhatsApp / Facebook / LinkedIn
         link previews)
    ══════════════════════════════════════════ -->
    <meta property="og:type"         content="website" />
    <meta property="og:site_name"    content="SheharSetu" />
    <meta property="og:title"        content="SheharSetu — Citizen Grievance Platform" />
    <meta property="og:description"  content="Report civic issues, track resolutions, and help build a better city. Powered by AI." />
    <meta property="og:image"        content="/icons/og_image_1200x630.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url"          content="https://sheharsetu.in" />

    <!-- ══════════════════════════════════════════
         TWITTER CARD
    ══════════════════════════════════════════ -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="SheharSetu — Citizen Grievance Platform" />
    <meta name="twitter:description" content="Report civic issues and track resolutions in your city." />
    <meta name="twitter:image"       content="/icons/og_image_1200x630.png" />

    <!-- ══════════════════════════════════════════
         FONTS (same as your original)
    ══════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
